<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | Kerugoya Main SDA</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="account-page">
    <main class="account-shell">
        <a class="account-brand" href="index.html"><img src="assets/images/sda logo.png" alt=""> Kerugoya Main SDA</a>
        <section class="account-panel">
            <div class="account-copy">
                <span class="eyebrow">Find your people</span>
                <h1>There is room for your voice.</h1>
                <p>Join thoughtful conversations, share what God is teaching you, and encourage someone in the week ahead.</p>
                <div class="account-note"><i class="bx bxs-message-rounded-dots"></i><span>Share generously. Listen deeply.</span></div>
            </div>
            <form class="account-form" id="register-form">
                <h2>Create account</h2>
                <p class="form-intro">Your first name will appear beside your posts.</p>
                <label for="register-name">Name</label>
                <input id="register-name" type="text" autocomplete="name" required>
                <label for="register-email">Email address</label>
                <input id="register-email" type="email" autocomplete="email" required>
                <label for="register-password">Password</label>
                <input id="register-password" type="password" minlength="6" autocomplete="new-password" required>
                <button class="btn form-submit" type="submit">Create account <i class="bx bx-right-arrow-alt"></i></button>
                <p class="form-message" id="register-message" role="status"></p>
                <p class="account-switch">Already a member? <a href="login.html">Sign in</a></p>
            </form>
        </section>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>

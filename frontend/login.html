<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Kerugoya Main SDA</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="account-page login-screen">
    <main class="account-shell">
        <a class="account-brand" href="index.html"><img src="assets/images/sda logo.png" alt=""> Kerugoya Main SDA</a>
        <section class="account-panel">
            <div class="account-copy">
                <span class="account-mark"><i class="bx bxs-sun"></i></span>
                <span class="eyebrow">Welcome back</span>
                <h1>Come as you are.</h1>
                <p>Stay close to the conversations, stories, and people that make our church family feel like home.</p>
                <div class="account-note"><i class="bx bxs-heart"></i><span>Faith grows beautifully in community.</span></div>
            </div>
            <form class="account-form" id="login-form">
                <h2>Sign in</h2>
                <p class="form-intro">Pick up where you left off.</p>
                <label for="login-email">Email address</label>
                <input id="login-email" type="email" autocomplete="email" required>
                <div class="field-heading"><label for="login-password">Password</label><a href="register.html">Need an account?</a></div>
                <div class="password-field">
                    <input id="login-password" type="password" autocomplete="current-password" required>
                    <button class="password-toggle" type="button" aria-label="Show password" data-password-target="login-password"><i class="bx bx-show"></i></button>
                </div>
                <button class="btn form-submit" type="submit">Sign in <i class="bx bx-right-arrow-alt"></i></button>
                <p class="form-message" id="login-message" role="status"></p>
                <p class="account-switch">New here? <a href="register.html">Create an account</a></p>
            </form>
        </section>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
